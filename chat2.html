<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tifah Space 💬</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f1f5;
    }

    header {
      background: #8e2457;
      color: white;
      padding: 18px;
      text-align: center;
    }

    #messages {
      height: calc(100vh - 145px);
      overflow-y: auto;
      padding: 15px;
      background: #fff;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      margin: 8px 0;
      border-radius: 16px;
      background: #eee;
      word-wrap: break-word;
    }

    .mine {
      margin-left: auto;
      background: #8e2457;
      color: white;
    }

    .composer {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 600px;
      display: flex;
      gap: 8px;
      padding: 10px;
      background: white;
      box-sizing: border-box;
    }

    #message {
      flex: 1;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    button {
      padding: 13px 18px;
      border: 0;
      border-radius: 10px;
      background: #8e2457;
      color: white;
    }
  </style>
</head>

<body>

<header>
  <h2>Tifah Space ❤️</h2>
  <small>Private Chat</small>
</header>

<div id="messages"></div>

<div class="composer">
  <input id="message" placeholder="Write a message...">
  <button onclick="sendMessage()">Send</button>
</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL "https://wrhuibbrmardwxkfgydf.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_6RFb3BS_n0TWydHrCJ2Yew_R8tzi8co";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function sendMessage() {

  const input = document.getElementById("message");
  const text = input.value.trim();

  if (!text) return;

  const { data: { user } } =
    await supabase.auth.getUser();

  if (!user) {
    alert("Please log in first.");
    return;
  }

  const { error } = await supabase
    .from("messages")
    .insert({
      sender_id: user.id,
      receiver_id: user.id,
      content: text
    });

  if (error) {
    alert(error.message);
    return;
  }

  input.value = "";
}

async function loadMessages() {

  const { data, error } =
    await supabase
      .from("messages")
      .select("*")
      .order("created_at", { ascending: true });

  if (error) {
    console.log(error);
    return;
  }

  document.getElementById("messages").innerHTML = "";

  data.forEach(showMessage);
}

function showMessage(message) {

  const div = document.createElement("div");

  div.className = "message";
  div.textContent = message.content;

  document
    .getElementById("messages")
    .appendChild(div);
}

loadMessages();

</script>

</body>
</html>
