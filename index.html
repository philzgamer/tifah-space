<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tifah Space ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f7f1f5;
      min-height: 100vh;
      color: #222;
    }

    header {
      background: #8e2457;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 6px;
      opacity: 0.9;
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h2 {
      margin-bottom: 12px;
      color: #8e2457;
    }

    .chat-button {
      display: block;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #8e2457;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .chat-button:hover {
      opacity: 0.9;
    }

    .features {
      margin-top: 15px;
      line-height: 2;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Tifah Space ❤️</h1>
    <p>A private space for us</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>Welcome ❤️</h2>
      <p>
        This is our private little space where we can chat,
        share memories and keep our special moments together.
      </p>
    </div>

    <div class="card">
      <h2>Our Space</h2>

      <div class="features">
        💬 Private Chat<br>
        📸 Share Photos<br>
        📁 Share Files<br>
        ❤️ Keep Special Memories
      </div>

      <br>

      <button class="chat-button" onclick="alert('Chat coming next ❤️')">
        Open Our Chat 💬
      </button>
    </div>

  </div>

  <footer>
    Made with ❤️ by MALINGA PHILEMON MALINGA
  </footer>

</body>
  </html>
